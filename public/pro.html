<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Fieldsheet</title>
<script>
(function () {
  var saved = localStorage.getItem('theme');
  var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="mark">field<em>sheet</em></span>
      <span class="sub">trade directory</span>
    </a>
    <nav class="site-nav">
      <a href="/index.html">Browse</a>
      <a href="/login.html">Pro login</a>
      <a href="/signup.html" class="cta">Sign up</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </button>
    </nav>
  </div>
</header>

<div class="wrap" id="pro-root">
  <p style="padding: 40px 0; color: var(--ink-faint);">Loading profile…</p>
</div>

<footer class="site-footer">
  <div class="wrap">
    <div>Fieldsheet is a directory, not a staffing agency — you book and pay each pro directly.</div>
    <div>Run a trade business? <a href="/signup.html">List your work here</a>.</div>
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="close" id="lightbox-close" aria-label="Close">&times;</button>
  <div>
    <img id="lightbox-img" src="" alt="">
    <div class="cap" id="lightbox-cap"></div>
  </div>
</div>

<script src="/js/icons.js"></script>
<script src="/js/illustrations.js"></script>
<script src="/js/util.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
